[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-ctl"
version = "0.1.4"
description = "CLI for managing and watching anime"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "platformdirs",
    "windows-curses; platform_system == 'Windows'",
    "httpx",
    "requests"
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
anime = "anime.main:main"

[tool.setuptools.packages.find]
include = ["anime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
